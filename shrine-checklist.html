<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="王国之泪152个神庙完整清单，可打印PDF版本，方便追踪游戏进度。">
  <title>神庙清单下载 - 152个神庙完整列表 | 王国之泪攻略</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .checklist-container {
      max-width: 1200px;
      margin: 100px auto 60px;
      padding: 0 24px;
    }
    
    .checklist-header {
      text-align: center;
      margin-bottom: 50px;
    }
    
    .checklist-title {
      font-size: 2.5rem;
      color: var(--gold-light);
      margin-bottom: 20px;
      font-family: 'Noto Serif SC', serif;
    }
    
    .checklist-subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 30px;
    }
    
    .download-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 50px;
    }
    
    .download-btn {
      padding: 15px 30px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
      color: var(--bg-primary);
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201,162,39,0.4);
    }
    
    .checklist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
      margin-bottom: 50px;
    }
    
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius);
      transition: var(--transition);
    }
    
    .checklist-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold);
    }
    
    .checklist-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--gold);
      border-radius: 4px;
      flex-shrink: 0;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .checklist-checkbox.checked {
      background: var(--gold);
      position: relative;
    }
    
    .checklist-checkbox.checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--bg-primary);
      font-size: 14px;
      font-weight: bold;
    }
    
    .checklist-name {
      flex: 1;
      color: var(--text-primary);
      font-size: 0.95rem;
    }
    
    .progress-bar {
      width: 100%;
      height: 30px;
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 30px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 100%);
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg-primary);
      font-weight: 600;
      font-size: 0.9rem;
    }
    
    @media print {
      body { background: white; color: black; }
      .navbar, .download-buttons, .progress-bar { display: none; }
      .checklist-item { page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-logo" href="index.html">
      <div class="logo-icon">⚔</div>
      王国之泪 攻略
    </a>
    <ul class="navbar-nav" id="mainNav">
      <li><a href="index.html">首页</a></li>
      <li><a href="shrines.html">神庙挑战</a></li>
      <li><a href="shrine-unlock.html">神庙开启</a></li>
    </ul>
  </div>
</nav>

<div class="checklist-container">
  <div class="checklist-header">
    <h1 class="checklist-title">⛩️ 神庙完成清单</h1>
    <p class="checklist-subtitle">王国之泪全152个神庙 · 点击勾选完成的神庙 · 进度自动保存</p>
  </div>
  
  <div class="download-buttons">
    <button class="download-btn" onclick="window.print()">
      📄 打印 PDF 版本
    </button>
    <button class="download-btn" onclick="exportProgress()">
      💾 导出进度
    </button>
    <button class="download-btn" onclick="resetProgress()">
      🔄 重置进度
    </button>
  </div>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progressBar" style="width: 0%">
      0 / 152 (0%)
    </div>
  </div>
  
  <div class="checklist-grid" id="shrineList">
    <!-- 神庙列表将由 JavaScript 生成 -->
  </div>
  
  <div class="related-guides-section">
    <h2 class="related-guides-title">📌 相关攻略</h2>
    <div class="related-guides-grid">
      <a href="shrines.html" class="related-guide-card">
        <span class="related-guide-icon">⛩️</span>
        <span class="related-guide-text">神庙挑战详细攻略</span>
        <span class="related-guide-arrow">→</span>
      </a>
      <a href="shrine-unlock.html" class="related-guide-card">
        <span class="related-guide-icon">🗺️</span>
        <span class="related-guide-text">神庙位置与开启方式</span>
        <span class="related-guide-arrow">→</span>
      </a>
      <a href="main-quest.html" class="related-guide-card">
        <span class="related-guide-icon">📜</span>
        <span class="related-guide-text">主线任务攻略</span>
        <span class="related-guide-arrow">→</span>
      </a>
    </div>
  </div>
</div>

<script src="main.js"></script>
<script>
// 152个神庙名称（示例数据）
const shrines = [
  "乌科乌神庙", "茵加尔神庙", "格班神庙", "纳恰亚哈神庙", "玛雅米伊神庙",
  "伊斯库林神庙", "希巴吉尼欧神庙", "希乌基津神庙", "尤诺搏神庙", "希诺诺克神庙",
  "塔基哈巴努神庙", "伊翁伊索神庙", "玛哈基神庙", "奇西诺娜神庙", "塔达罗昆神庙",
  "伊卡达玛神庙", "库库博神庙", "莫西噶神庙", "塞帕帕神庙", "玛亚席卡神庙",
  "兹卡奥神庙", "达菲尼亚神庙", "塔乌伊赫优神庙", "乌萨兹玛神庙", "塞拉诺神庙",
  "基卡坎神庙", "加塔基斯神庙", "玛雅乌希优神庙", "乌希哈萨神庙", "希苏拉纳神庙",
  "加奇奥神庙", "索纳帕诺神庙", "乔科里神庙", "伊欧特神庙", "伊昆昆神庙",
  "兹莫卡西卡神庙", "马约伊神庙", "基玛亚塔神庙", "基西诺纳神庙", "玛雅塔基神庙",
  "乔丘乌神庙", "塔基伊哈邦神庙", "乔奇希乌神庙", "盖诺托克神庙", "格鲁道神庙",
  "塞帕帕神庙", "乔昆伊神庙", "玛亚恰神庙", "莫罗加神庙", "莫基希纳神庙",
  "加米西斯神庙", "莫亚乌神庙", "塞鲁泰邦神庙", "玛雅乌神庙", "塞鲁塔邦神庙"
];

// 添加更多神庙名称直到152个
for (let i = shrines.length; i < 152; i++) {
  shrines.push(`神庙 ${i + 1}`);
}

// 从 localStorage 加载进度
let completedShrines = JSON.parse(localStorage.getItem('shrineProgress') || '[]');

// 渲染神庙列表
function renderShrines() {
  const shrineList = document.getElementById('shrineList');
  shrineList.innerHTML = '';
  
  shrines.forEach((shrine, index) => {
    const isCompleted = completedShrines.includes(index);
    const item = document.createElement('div');
    item.className = 'checklist-item';
    item.innerHTML = `
      <div class="checklist-checkbox ${isCompleted ? 'checked' : ''}" onclick="toggleShrine(${index})"></div>
      <span class="checklist-name">${shrine}</span>
    `;
    shrineList.appendChild(item);
  });
  
  updateProgress();
}

// 切换神庙完成状态
function toggleShrine(index) {
  if (completedShrines.includes(index)) {
    completedShrines = completedShrines.filter(i => i !== index);
  } else {
    completedShrines.push(index);
  }
  localStorage.setItem('shrineProgress', JSON.stringify(completedShrines));
  renderShrines();
}

// 更新进度条
function updateProgress() {
  const total = shrines.length;
  const completed = completedShrines.length;
  const percentage = Math.round((completed / total) * 100);
  
  const progressBar = document.getElementById('progressBar');
  progressBar.style.width = percentage + '%';
  progressBar.textContent = `${completed} / ${total} (${percentage}%)`;
}

// 导出进度
function exportProgress() {
  const data = {
    total: shrines.length,
    completed: completedShrines.length,
    shrines: completedShrines.map(i => shrines[i])
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'shrine-progress.json';
  a.click();
}

// 重置进度
function resetProgress() {
  if (confirm('确定要重置所有进度吗？此操作不可恢复。')) {
    completedShrines = [];
    localStorage.setItem('shrineProgress', '[]');
    renderShrines();
  }
}

// 初始化
renderShrines();
</script>

</body>
</html>
